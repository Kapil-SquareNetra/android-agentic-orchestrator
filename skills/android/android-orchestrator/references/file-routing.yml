# Canonical file routing. Aliases map to skills/android/android-* folders.
# Hub resolves alias -> folder via skill_aliases, unions all matching globs, dedupes skills.

skill_aliases:
  kotlin: android-kotlin
  compose: android-compose
  accessibility: android-accessibility
  viewmodel: android-viewmodel
  domain: android-domain
  data-layer: android-data
  architecture: android-architecture
  networking: android-networking
  database: android-database
  navigation: android-navigation
  testing: android-testing
  maestro: android-maestro
  functional-requirements: android-functional-requirements
  detekt: android-detekt
  security: android-security
  performance: android-performance
  code-review: android-code-review
  requirement-analysis: android-requirement-analysis
  impact-analysis: android-impact-analysis

routing:
  "**/*.kt":
    - kotlin

  "**/ui/**/*.kt":
    - kotlin
    - compose

  "**/*Screen.kt":
    - kotlin
    - compose
    - accessibility

  "**/*ViewModel.kt":
    - kotlin
    - viewmodel

  "**/domain/**/*.kt":
    - kotlin
    - domain

  "**/*UseCase.kt":
    - kotlin
    - domain

  "**/data/**/*.kt":
    - kotlin
    - data-layer

  "**/*Repository.kt":
    - kotlin
    - data-layer
    - architecture

  "**/*Api.kt":
    - kotlin
    - networking

  "**/network/**/*.kt":
    - kotlin
    - networking

  "**/*Dao.kt":
    - kotlin
    - database

  "**/database/**/*.kt":
    - kotlin
    - database

  "**/*Dto.kt":
    - kotlin
    - networking

  "**/*Entity.kt":
    - kotlin
    - database

  "**/*Mapper.kt":
    - kotlin
    - data-layer

  "**/di/**/*.kt":
    - kotlin
    - architecture

  "**/*Module.kt":
    - kotlin
    - architecture

  "**/navigation/**/*.kt":
    - kotlin
    - navigation

  "**/test/**/*.kt":
    - kotlin
    - testing

  "**/androidTest/**/*.kt":
    - kotlin
    - testing

  "**/*.gradle.kts":
    - kotlin
    - architecture

  "**/libs.versions.toml":
    - architecture

  "**/AndroidManifest.xml":
    - architecture
    - security

  "**/res/**":
    - compose
    - accessibility

  "**/network_security_config.xml":
    - security
    - architecture

  "**/proguard-rules.pro":
    - security
    - architecture

  "**/maestro/**/*.yaml":
    - maestro
    - testing
    - functional-requirements

  "**/maestro/**/*.yml":
    - maestro
    - testing
    - functional-requirements

  "**/.maestro/**/*.yaml":
    - maestro
    - testing
    - functional-requirements

  "**/.maestro/**/*.yml":
    - maestro
    - testing
    - functional-requirements

  ".maestro/*.yaml":
    - maestro
    - testing
    - functional-requirements

  ".maestro/*.yml":
    - maestro
    - testing
    - functional-requirements
